# TLS 站点模板：80 强制跳 443；证书挂载 /etc/nginx/certs/（经 docker-compose.prod.tls.yml 覆盖注入）。
# 三种接入方式见 docs/tls.md（自签演示 / certbot 自动签 / 云 LB 终结后回源 80）。

# HTTP → HTTPS
server {
    listen 80;
    server_name _;
    # ACME http-01 挑战放行（certbot 模式需要），其余一律跳转
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 以下与 frontend/nginx.conf 的 80 站点保持同一套路由与 SSE 反代参数（双份维护，
    # 改路由时两处同步；如嫌重复可在镜像内用 include 片段化——保持模板简单直给）
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 限流信任链：覆写为不可伪造的直连地址（与 prod compose trust-proxy=true 配套）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # SSE：关闭缓冲、放长读超时（深度模式可到 10 分钟）
        proxy_buffering off;
        proxy_read_timeout 660s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
