# 基础告警规则（生产起步集）：服务存活性、5xx 错误率、Agent 链路延迟与流量心跳。
# 告警经 alertmanager 路由（deploy/observability/alertmanager.yml 配置接收端）。
groups:
  - name: smartsupply-core
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "服务 {{ $labels.job }}（{{ $labels.instance }}）抓取失败"
          description: "Prometheus 连续 1 分钟无法抓取目标，实例可能宕机或网络中断。"

      - alert: HttpServer5xxRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "HTTP 5xx 错误率超过 5%（持续 5 分钟）"
          description: "当前 5xx 占比 {{ $value | humanizePercentage }}。"

      - alert: AgentApi5xxBurst
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/agent.*",status=~"5.."}[5m])) > 0.1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Agent 接口出现 5xx 突增（>0.1 req/s 持续 2 分钟）"
          description: "Agent 编排链路（chat/stream）异常，检查边车与模型服务。"

      - alert: AgentChatP95LatencyHigh
        expr: histogram_quantile(0.95, sum(rate(agent_chat_latency_seconds_bucket[10m])) by (le)) > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Agent chat P95 延迟超过 5s（持续 10 分钟）"
          description: "可能为模型/边车变慢，观察 agent_chat_latency 与 Langfuse trace。"

      - alert: AgentTrafficHeartbeatLost
        expr: sum(rate(agent_chat_count_total[30m])) == 0
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "近 30 分钟无任何 Agent 流量"
          description: "心跳型提示：无流量可能是业务正常，也可能是入口链路断了，请人工确认。"
