# TLS 覆盖文件（可选叠加）：
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.tls.yml up -d
# 前置条件：证书与私钥放 ./deploy/certs/{fullchain.pem,privkey.pem}（获取方式见 docs/tls.md）。
services:
  frontend:
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/default-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
