version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartsupply-postgres
    environment:
      POSTGRES_DB: smartsupply
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-smartsupply}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartsupply-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data


volumes:
  pgdata:
  redisdata:
