# 可观测平台编排（可选叠加）：
#   docker compose -f docker-compose.prod.yml -f docker-compose.obs.yml up -d
# 拆出独立文件的根因：:? 必填校验在组合文件里可对 obs 服务生效——用 --profile 时
# compose config 会为所有 profile 求值，:? 会误伤不启用 obs 的部署（langfuse 弱密钥
# 曾以 UNSAFE-DEFAULT 占位混过校验，这里彻底收口）。
# 端口只绑回环 127.0.0.1：宿主机本机可访问，外部需经 ssh 隧道或反向代理加保护后暴露。
# 服务不带 profiles 标记：本文件本身即 opt-in（-f 叠加才生效），与 --profile 方式二选一。
x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      # 启用 obs 即必须显式提供强密钥（:? 缺省启动失败）
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET is required when obs is enabled}
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT is required when obs is enabled}
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required when obs is enabled}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus

volumes:
  promdata: {}
  grafanadata: {}
