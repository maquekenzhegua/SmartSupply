services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartsupply}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-smartsupply}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 10s, retries: 5 }
  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartsupply}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dev}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
      SPRING_DATA_REDIS_HOST: redis
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      JWT_SECRET: ${JWT_SECRET:-change-me-32chars-minimum-secret-please}
      AGENT_PYTHON_ENABLED: ${AGENT_PYTHON_ENABLED:-false}
      AGENT_PYTHON_URL: ${AGENT_PYTHON_URL:-http://agent-python:8001}
    ports: ["8080:8080"]
  agent-python:
    build: ./agent-python
    environment:
      JAVA_API_BASE: http://backend:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports: ["8001:8001"]
    depends_on: [backend]
volumes: { pgdata: {}, redisdata: {},  }
