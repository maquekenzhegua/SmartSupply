# 生产编排：只有 nginx 对外暴露 80（TLS 见 docker-compose.prod.tls.yml 覆盖文件）；
# PG/Redis/边车均不发布端口。密钥不设默认值（:? 语法缺省即启动失败），从 .env 注入。
# 可观测平台（Langfuse/Prometheus/Grafana/Alertmanager）拆在 docker-compose.obs.yml，
# 按需叠加：docker compose -f docker-compose.prod.yml -f docker-compose.obs.yml up -d
# （拆分的根本原因：obs 服务的必填密钥可用 :? 强制，而 profile 方式无法做到——
#   compose config 会为所有 profile 求值，:? 会误伤不启用 obs 的部署）。

# 固定项目名：镜像名确定性（smartsupply-backend 等），CI 发布按此打 GHCR 标签
name: smartsupply

# 统一日志轮转：json-file 默认无界增长会吃满宿主机磁盘（此前全部服务未配置）
x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartsupply}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema 单一事实源 = 应用内 Flyway；此处只挂辅助库初始化目录（幂等创建 langfuse 库）。
      # 单文件挂进整目录挂载的 initdb.d 会报 read-only file system，必须整目录挂载。
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-smartsupply}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 10s, retries: 5 }

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    cpus: 2
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartsupply}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dev}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      # fail-closed：必须显式选择——离线演示 true / 接真实模型 false。此前默认 true，
      # 漏配时生产会静默用 Mock 模型答话而不自知
      AI_MOCK: ${AI_MOCK:?AI_MOCK must be set explicitly (true=offline mock demo, false=real model with OPENAI_API_KEY)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET (>=32 chars) is required}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_OPS_PASSWORD: ${DEMO_OPS_PASSWORD:-}
      AGENT_PYTHON_ENABLED: ${AGENT_PYTHON_ENABLED:-false}
      AGENT_PYTHON_URL: http://agent-python:8001
      AGENT_PYTHON_API_KEY: ${AGENT_PYTHON_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      # 本拓扑：frontend nginx 是唯一可信反代，且已覆写 X-Forwarded-For=$remote_addr（不可伪造）。
      # 必须开启，否则限流 key 全部落在 nginx 容器 IP 上，全体用户共享一个配额桶会互相锁死。
      SMARTSUPPLY_RATELIMIT_TRUST_PROXY: "true"

  agent-python:
    build: ./agent-python
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1536m
    cpus: 2
    environment:
      JAVA_API_BASE: http://backend:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      SIDECAR_USERNAME: ${SIDECAR_USERNAME:-}
      SIDECAR_PASSWORD: ${SIDECAR_PASSWORD:-}
      SIDECAR_API_KEY: ${SIDECAR_API_KEY:-}
      # 可观测性（可选）：配置 LANGFUSE_* 后 trace 上报到 langfuse 服务（见 docker-compose.obs.yml）
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      # 写闸门（interrupt）挂起状态持久化：重启/多实例后待审批 run 仍可恢复；
      # Postgres 不可达时边车自动降级进程内 MemorySaver 并大声告警（app/checkpointing.py）
      CHECKPOINT_URI: postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartsupply}
    depends_on:
      backend: { condition: service_healthy }
      postgres: { condition: service_healthy }

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    ports: ["80:80"]
    depends_on:
      backend: { condition: service_healthy }

volumes: { pgdata: {}, redisdata: {} }
