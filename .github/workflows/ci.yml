name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_real_eval:
        description: '使用仓库 Secrets 中的真实 LLM Key 跑评测'
        type: boolean
        default: false
      run_perf:
        description: '起本地栈跑 k6 负载冒烟（读+写场景，P95 阈值门禁）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ChatMemoryServiceTest / BusinessFlowTest 需要 localhost:6379 的 Redis（会话记忆、幂等键预清理）。
    # 首次真实 CI 暴露：开发机常驻 dev Redis 而 runner 没有；其余套件确为离线（H2 + Testcontainers 真 PG）。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: "Backend test (H2 + Mock + job 服务 Redis；真 PG 回归走 Testcontainers)"
        working-directory: backend
        run: mvn -B test
      # 真 PG 回归（Testcontainers，pgvector 镜像 + 真实 Flyway 迁移）：ubuntu runner 自带 Docker，
      # 会真实执行；无 Docker 的本地环境由 disabledWithoutDocker 自动跳过
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Infra (postgres + redis)
        run: docker compose up -d postgres redis
      - name: Backend (AI_MOCK, datasource -> compose postgres)
        working-directory: backend
        env:
          SPRING_DATASOURCE_USERNAME: dev
          SPRING_DATASOURCE_PASSWORD: change-me-strong-password
        run: |
          mvn -B -q package -DskipTests
          nohup java -jar target/*.jar --server.port=8080 > backend-e2e.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/api/auth/login -X POST -H 'Content-Type: application/json' -d '{"username":"x","password":"x"}' && break || sleep 2; done
      - name: Frontend deps + Playwright
        working-directory: frontend
        run: |
          # runner 预置的 google-chrome apt 源在 Google CDN 侧持续返回与 Release 不一致的
          # Packages.gz（两次 run 哈希逐字节相同，非瞬时抖动），连带 playwright --with-deps
          # 的 apt 更新整体失败；按内容清除该源（兼容 .list 与 deb822 .sources 两种命名）
          sudo grep -rl "dl.google.com" /etc/apt/sources.list.d/ | sudo xargs -r rm -f
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E main flow
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test
      - name: Build (vue-tsc + vite)
        working-directory: frontend
        run: npm run build

  agent-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent-python/requirements.txt
      - name: Python tests (offline mock, no LLM key)
        working-directory: agent-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests -q -m "not real_llm"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, agent-python]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # 多阶段 Dockerfile 直接从源码构建（无需预编译产物）；prod compose 的 :? 必填变量
      # 在 build 时同样会被求值，必须与下方 config 校验步骤一致地给 stub
      - run: docker compose -f docker-compose.prod.yml build
        env:
          POSTGRES_PASSWORD: ci-stub-password
          JWT_SECRET: ci-stub-jwt-secret-0123456789abcdef0123456789abcdef
          AI_MOCK: 'true'
      - name: Validate prod compose config (with required secrets stubbed)
        env:
          POSTGRES_PASSWORD: ci-stub-password
          JWT_SECRET: ci-stub-jwt-secret-0123456789abcdef0123456789abcdef
          AI_MOCK: 'true'
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate obs compose config (secrets stubbed)
        env:
          POSTGRES_PASSWORD: ci-stub-password
          LANGFUSE_NEXTAUTH_SECRET: ci-stub-langfuse-nextauth-secret
          LANGFUSE_SALT: ci-stub-langfuse-salt
          GRAFANA_ADMIN_PASSWORD: ci-stub-grafana
        run: docker compose -f docker-compose.prod.yml -f docker-compose.obs.yml config --quiet
      - name: Validate TLS overlay compose config
        run: docker compose -f docker-compose.prod.yml -f docker-compose.prod.tls.yml config --quiet
      # 镜像发布：此前只 build 不 push，部署只能目标机自行构建（"最后一公里"缺口）
      # tag = sha（可回滚定位）+ latest（滚动）；GHCR 登录用内置 GITHUB_TOKEN
      - name: Push images to GHCR (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_LC: ${{ github.repository }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          REPO="${REPO_LC,,}"
          for svc in backend frontend agent-python; do
            img="ghcr.io/${REPO}/${svc}"
            docker tag "smartsupply-${svc}" "$img:${{ github.sha }}"
            docker tag "smartsupply-${svc}" "$img:latest"
            docker push "$img:${{ github.sha }}"
            docker push "$img:latest"
            echo "pushed $img"
          done

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent-python/requirements.txt
      # 脚本内部以 agent-python 为根解析相对路径（llm_judge.py:277 把 --out 拼到 ROOT 下），
      # 必须用 working-directory + docs/ 相对路径——从仓库根传 "agent-python/docs/..."
      # 会被写成 agent-python/agent-python/docs/，check_gate 读不到报告而 GATE FAIL（已踩坑）
      - name: Offline golden eval (mock = smoke baseline)
        working-directory: agent-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests/test_golden_eval.py::test_offline_recall_and_answer_keyword_coverage tests/test_golden_eval.py::test_golden_count -v
          python -m pytest tests/test_agent_eval.py -v
          python scripts/llm_judge.py --mode mock --recall bigram --out docs/eval-report-mock-ci.md
          # 数值门禁：解析报告指标并与阈值比较（不再是无判定的 grep）
          python scripts/check_gate.py docs/eval-report-mock-ci.md --min-hit 0.6
          # trajectory 评测：工具调用序列 vs golden 期望（评"调对工具"，与答案质量互补）
          python scripts/eval_trajectory.py --mode mock --out docs/eval-trajectory-mock-ci.md --min-f1 0.9
          python scripts/check_gate.py docs/eval-trajectory-mock-ci.md --min-tool-f1 0.9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-mock
          path: |
            agent-python/docs/eval-report-mock-ci.md
            agent-python/docs/eval-trajectory-mock-ci.md
          retention-days: 14

  real-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_eval }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent-python/requirements.txt
      - name: "Real LLM eval (requires secrets: OPENAI_API_KEY / OPENAI_BASE_URL / AI_MODEL)"
        working-directory: agent-python
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          EVAL_REAL_LLM: '1'
        run: |
          pip install -r requirements.txt
          # golden 集真实模型评测 + LLM-as-judge，产出带真实指标的报告
          python -m pytest tests/test_golden_eval.py -v -m real_llm
          python scripts/llm_judge.py --mode real --recall bigram --out docs/eval-report-real-ci.md
          # llm_judge 内部已默认 faith>=1.2 门禁；此处为报告解析层的双保险
          python scripts/check_gate.py docs/eval-report-real-ci.md --min-hit 0.6 --min-faithfulness 1.2
          # 回归对比：与入库的脱敏汇总基线比，相对跌幅>10% 即 FAIL（快照 API 在 CI 无后端不可达）
          python scripts/compare_eval.py --report docs/eval-report-real-ci.md --baseline-report ../docs/eval-report-real-summary.md
          # trajectory（真实模型）：信息性收集（真实模型规划可合理偏离 golden 关键词口径，暂不设门禁）
          python scripts/eval_trajectory.py --mode real --out docs/eval-trajectory-real-ci.md
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-real
          path: |
            agent-python/docs/eval-report-real-ci.md
            agent-python/docs/eval-trajectory-real-ci.md
          retention-days: 30

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_perf }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Infra (postgres + redis)
        run: docker compose up -d postgres redis
      - name: Backend (AI_MOCK, 限流关闭压数据库而非限流器)
        working-directory: backend
        env:
          SPRING_DATASOURCE_USERNAME: dev
          SPRING_DATASOURCE_PASSWORD: change-me-strong-password
          SMARTSUPPLY_RATELIMIT_ENABLED: 'false'
        run: |
          mvn -B -q package -DskipTests
          nohup java -jar target/*.jar --server.port=8080 > backend-perf.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/api/auth/login -X POST -H 'Content-Type: application/json' -d '{"username":"x","password":"x"}' && break || sleep 2; done
      - name: k6 读链路（P95 阈值门禁）
        run: docker run --rm -i -e BASE_URL=http://host.docker.internal:8080 --add-host=host.docker.internal:host-gateway grafana/k6 run - < deploy/loadtest/k6-smoke.js
      - name: k6 写链路（P95 阈值门禁）
        run: docker run --rm -i -e BASE_URL=http://host.docker.internal:8080 -e SCENARIO=writes --add-host=host.docker.internal:host-gateway grafana/k6 run - < deploy/loadtest/k6-smoke.js
