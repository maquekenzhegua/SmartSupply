server {
    listen 80;
    server_name _;

    # SPA 静态资源
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 后端 API 反代：path 原样透传（后端本身挂在 /api 前缀下）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # SSE 必需：关缓冲 + 清空 Connection 头，token 才能实时到达前端
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 660s;
        proxy_set_header Host $host;
        # 覆写而非追加：本容器是唯一可信代理，X-Forwarded-For 必须是"真实客户端 IP"。
        # 若用 $proxy_add_x_forwarded_for（追加），客户端可自带伪造头刷掉后端限流配额；
        # 后端 SMARTSUPPLY_RATELIMIT_TRUST_PROXY=true 即信任此头取限流 key。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
