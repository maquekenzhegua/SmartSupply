server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartsupply}
    username: ${SPRING_DATASOURCE_USERNAME:smartsupply}
    password: ${SPRING_DATASOURCE_PASSWORD:smartsupply123}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  ai:
    openai:
      # 填你的 Key；留空则走 mock
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.3
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${VECTOR_DIMENSIONS:1024}

smartsupply:
  ai:
    mock: ${AI_MOCK:true}
    pricing:
      # 成本核算（B1）：fallback 全局单价（USD/1k tokens）；多模型路由时按模型配价，未配价回退这里并告警
      prompt-per-1k: ${AI_PRICING_PROMPT_PER_1K:0.0015}
      completion-per-1k: ${AI_PRICING_COMPLETION_PER_1K:0.002}
      # 按模型价格表（relaxed binding：ai.pricing.models.<模型名>.prompt-per-1k），示例：
      # models:
      #   mimo-v2.5:        { prompt-per-1k: 0.0020, completion-per-1k: 0.0060 }
      #   gpt-4o-mini:      { prompt-per-1k: 0.00015, completion-per-1k: 0.0006 }
      models: {}
    # 通义千问 / DeepSeek 兼容：切 base-url 与 model 即可
    # Embedding 端点与 Chat 解耦（可独立指向本地 Ollama 等 OpenAI 兼容 /v1/embeddings 服务）：
    #   EMBEDDING_BASE_URL=http://localhost:11434/v1  EMBEDDING_API_KEY=ollama  EMBEDDING_MODEL=qwen3-embedding:0.6b
    #   本地 Ollama 免费、离线、中文友好（qwen3-embedding:0.6b / bge-m3 均为 1024 维，VECTOR_DIMENSIONS=1024）
    # 不设 EMBEDDING_* 时回退 spring.ai.openai.*；muse/opencode 网关无 /embeddings，会被自动拒绝
    embedding:
      base-url: ${EMBEDDING_BASE_URL:${spring.ai.openai.base-url:}}
      api-key: ${EMBEDDING_API_KEY:${spring.ai.openai.api-key:}}
    embedding-mock: ${EMBEDDING_MOCK:false}
  rag:
    rerank-mode: ${RAG_RERANK_MODE:auto}
  jwt:
    secret: ${JWT_SECRET:smartsupply-dev-secret-key-please-change-in-prod-32chars!}
    expire-hours: 12
  agent-python:
    enabled: ${AGENT_PYTHON_ENABLED:false}
    base-url: ${AGENT_PYTHON_URL:http://127.0.0.1:8001}
    timeout-ms: 90000   # 深度模式多步 ReAct（2~6 次 LLM 调用 + 工具回环），12s 必然超时并拖垮熔断
    api-key: ${AGENT_PYTHON_API_KEY:}   # 与边车 SIDECAR_API_KEY 共享，防内网裸奔
  agent:
    tool:
      # 无 Key 演示允许匿名只读工具；prod 覆盖为 false（读工具同样要求登录）
      allow-anonymous-read: ${AGENT_TOOL_ALLOW_ANONYMOUS_READ:true}
    # 成本管控（B3）：用户级日预算（USD/人/天），超限 /chat 与 /chat/stream 直接 429 拒绝。
    # 0=关闭（默认不改现网行为）；生产按量级显式设置，如 5.0
    daily-cost-limit-usd: ${AGENT_DAILY_COST_LIMIT_USD:0}
    memory:
      # 上下文窗口 token 预算（超预算老消息由滚动摘要承接语义）；0=退回固定 20 条旧口径
      token-budget: ${AGENT_MEMORY_TOKEN_BUDGET:4000}

security:
  cors:
    # 精确白名单（逗号分隔），不再 "*" + credentials
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.smartsupply: DEBUG
    org.springframework.ai: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:true}
  metrics:
    tags:
      application: smartsupply
